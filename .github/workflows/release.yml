name: Create Release

on:
  push:
    tags-ignore:
      - testing_*

jobs:
  npc-list:
    runs-on: ubuntu-latest
    env:
      # ResLogger2 export (https://rl2.perchbird.dev/Downloads)
      RESLOG_PATHLIST_URL: https://rl2.perchbird.dev/download/CurrentPathList.zip
      # BNpcBase -> BNpcName index
      BNPC_INDEX_URL: https://raw.githubusercontent.com/ffxiv-teamcraft/ffxiv-teamcraft/staging/libs/data/src/lib/json/gubal-bnpcs-index.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download source files
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p reslog && cd reslog

          fetch() { # fetch <url> <output name> [file inside zip], unpacking .gz / .zip if needed
            curl -fsSL --retry 3 "$1" -o download.tmp
            if gzip -t download.tmp 2>/dev/null; then
              gunzip -c download.tmp > "$2"
            elif unzip -tq download.tmp >/dev/null 2>&1; then
              unzip -p download.tmp ${3:+"$3"} > "$2"
            else
              mv download.tmp "$2"
            fi
            rm -f download.tmp
          }

          fetch "$RESLOG_PATHLIST_URL" CurrentPathList CurrentPathList.txt
          test -s CurrentPathList
          echo "CurrentPathList: $(wc -l < CurrentPathList) paths"
          fetch "$BNPC_INDEX_URL" bnpc-download.json
      - name: Format bnpc.json
        working-directory: ${{ runner.temp }}/reslog
        run: |
          python - <<'PY'
          import json
          data = json.load(open("bnpc-download.json"))
          assert isinstance(data, dict) and len(data) > 10000, f"unexpected bnpc index ({len(data)} entries)"
          with open("bnpc.json", "w") as f:
              json.dump(data, f, indent=4)
          print(f"bnpc.json: {len(data)} entries")
          PY
      - name: Run reslog_process.py
        working-directory: ${{ runner.temp }}/reslog
        run: python "$GITHUB_WORKSPACE/scripts/reslog_process.py"
      - name: Upload npc data
        uses: actions/upload-artifact@v4
        with:
          name: npc-list
          path: |
            ${{ runner.temp }}/reslog/npc_files.json
            ${{ runner.temp }}/reslog/bnpc.json

  build:
    needs: npc-list
    # still release even if the npc list couldn't be generated
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
              10.x.x
              9.x.x
      - name: Download npc list
        if: ${{ needs.npc-list.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: npc-list
          path: npc-list
      - name: Update npc_files.json and bnpc.json
        if: ${{ needs.npc-list.result == 'success' }}
        run: |
          Copy-Item npc-list/npc_files.json VFXEditor/Files/npc_files.json -Force
          Copy-Item npc-list/bnpc.json VFXEditor/Files/bnpc.json -Force
      - name: Restore dependencies
        run: dotnet restore
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          $ver = '${{ github.ref_name }}'
          invoke-expression 'dotnet build --no-restore --configuration Beta --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver'
      - name: write version into jsons
        run: |
          $ver = '${{ github.ref_name }}'
          $path = './VFXEditor/bin/Beta/VFXEditor-Beta.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = $ver
          $content = $json | ConvertTo-Json
          set-content -Path $path -Value $content
      - name: Archive
        run: Compress-Archive -Path VFXEditor/bin/Beta/* -DestinationPath VFXEditor-Beta.zip
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./VFXEditor/bin/Beta/*
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: VFXEditor Beta ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./VFXEditor-Beta.zip
          asset_name: VFXEditor-Beta.zip
          asset_content_type: application/zip

      - name: Write out repo.json
        run: |
          $ver = '${{ github.ref_name }}'
          $path = './repo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json[0].AssemblyVersion = $ver
          $json[0].TestingAssemblyVersion = $ver
          $json[0].DownloadLinkInstall = $json.DownloadLinkInstall -replace '[^/]+/VFXEditor-Beta.zip',"$ver/VFXEditor-Beta.zip"
          $json[0].DownloadLinkTesting = $json.DownloadLinkTesting -replace '[^/]+/VFXEditor-Beta.zip',"$ver/VFXEditor-Beta.zip"
          $json[0].DownloadLinkUpdate = $json.DownloadLinkUpdate -replace '[^/]+/VFXEditor-Beta.zip',"$ver/VFXEditor-Beta.zip"
          $content = $json | ConvertTo-Json -AsArray
          set-content -Path $path -Value $content

      - name: Commit repo.json
        run: |
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git branch -f main ${{ github.sha }}
          git checkout main
          git add repo.json VFXEditor/Files/npc_files.json VFXEditor/Files/bnpc.json
          git commit -m "[CI] Updating repo.json and npc list for ${{ github.ref_name }}" || true
          git push origin main